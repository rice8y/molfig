[package]
name = "molfig"
version = "0.2.0"
edition = "2021"
description = "Mol*-compatible molecular renderer and geometry exporter for Typst"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libm = { version = "0.2.16", default-features = false }
png = { version = "0.18.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
png = { version = "0.18.1", default-features = false }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
